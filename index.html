      // spa-github-pages — restore path encoded by 404.html before React boots.
      // 404.html uses /?/ as separator so decoded[0] is already the full path
      // with a leading /, safe to concatenate directly onto the base pathname.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) +
              decoded[0] +
              (decoded[1] ? '?' + decoded[1] : '') +
              l.hash
          );
        }
      })(window.location);
